<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Who owns the night? - Sprint 1</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="src/style.css">
    <link rel="stylesheet" href="src/bar-list.css">
</head>
<body>
    <main class="">

        <ul class="bar-list">

            <li>
                <article class="bar-card">
                    <img class="bar-card-photo" src="media/de-borrelbar.webp" alt="De Borrelbar">
                    <div class="bar-card-body">
                        <div class="bar-card-title">
                            <h2 class="text-card-title">De Borrelbar</h2>
                            <p class="text-body">Club · Stratumseind · Casual bar</p>
                        </div>

                        <div class="friends-box">
                            <div class="avatar-stack" aria-hidden="true">
                                <span class="avatar avatar--3 text-avatar">N</span>
                                <span class="avatar avatar--4 text-avatar">R</span>
                            </div>
                            <div>
                                <p class="text-body-strong">Recommended by 2 friends</p>
                                <p class="text-small">Noa and Ravi</p>
                            </div>
                        </div>

                        <ul class="chip-list">
                            <li class="chip text-chip">Respectful crowd · 2</li>
                            <li class="chip text-chip">Good music · 1</li>
                        </ul>

                        <blockquote class="text-body-quote">“Easy to go with a mixed group, nice vibe.”</blockquote>
                    </div>
                </article>
            </li>

        </ul>
    </main>
</body>
</html>
